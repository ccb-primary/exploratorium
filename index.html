<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Exploratorium: Booking System CCB Primary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-6 font-sans">

  <!-- Header -->
  <header class="w-full bg-indigo-900 text-white p-5 rounded-xl shadow-lg mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-3xl font-bold tracking-tight">The Exploratorium: Booking System CCB Primary</h1>
      <p class="text-sm text-indigo-200 mt-1">Cloud Connected • Dynamic Timetable & Admin Controls</p>
    </div>
    <div class="flex items-center gap-4">
      <span id="userInfo" class="text-base font-medium bg-indigo-800 px-4 py-2 rounded-lg">Not logged in</span>
      <button id="adminPanelBtn" onclick="toggleAdminModal()" class="hidden bg-amber-500 hover:bg-amber-600 px-4 py-2 rounded-lg text-base font-semibold text-slate-900 transition shadow">⚙️ Admin Panel</button>
      <button id="loginBtn" onclick="handleAuthAction()" class="bg-indigo-500 hover:bg-indigo-600 px-5 py-2.5 rounded-lg text-base font-semibold transition shadow">Login</button>
    </div>
  </header>

  <!-- Main Controls -->
  <main class="w-full bg-white rounded-xl shadow-md p-6">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b">
      <div class="flex items-center gap-3">
        <button onclick="changeWeek(-1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-base font-semibold text-slate-700 transition">‹ Prev Week</button>
        <button onclick="resetWeek()" class="px-4 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-base font-semibold transition">Current Week</button>
        <button onclick="changeWeek(1)" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg text-base font-semibold text-slate-700 transition">Next Week ›</button>
        <span id="currentWeekLabel" class="ml-3 px-4 py-2 bg-slate-100 text-slate-900 rounded-lg text-base font-bold border border-slate-200"></span>
      </div>
      <button onclick="window.print()" class="bg-slate-800 text-white px-5 py-2.5 rounded-lg text-base font-semibold hover:bg-slate-900 transition shadow">🖨️ Door Display / Print</button>
    </div>

    <!-- Timetable Grid -->
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-center text-base">
        <thead>
          <tr id="gridHeader" class="bg-slate-100 border-b"></tr>
        </thead>
        <tbody id="gridBody" class="divide-y divide-slate-200"></tbody>
      </table>
    </div>
  </main>

  <!-- Booking Modal -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
      <h3 id="modalTitle" class="text-xl font-bold mb-2">Book Slot</h3>
      <p id="modalSlotDetails" class="text-base text-slate-500 mb-4"></p>
      
      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Teacher Name</label>
          <input type="text" id="userNameInput" required readonly class="w-full border bg-slate-50 rounded p-2.5 text-base text-slate-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Purpose / Class Details</label>
          <textarea id="userPurposeInput" placeholder="e.g. Year 10 Physics - Optics experiment with light kits" required rows="3" class="w-full border rounded p-2.5 text-base focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div id="adminRecurringOption" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-lg">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="recurringCheckbox" class="rounded text-amber-600 focus:ring-amber-500 h-4 w-4">
            <span class="text-xs font-semibold text-amber-900">Repeat weekly for rest of school year</span>
          </label>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-base font-semibold text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
          <button type="submit" class="px-5 py-2 text-base font-semibold bg-indigo-600 text-white rounded hover:bg-indigo-700 shadow">Save Booking</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Login / Register Modal -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl">
      <div class="flex justify-between border-b pb-2 mb-4">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1 text-base">Login</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="font-bold text-slate-400 hover:text-slate-600 pb-1 text-base">Register (Teacher)</button>
      </div>

      <form id="loginForm" onsubmit="performLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="loginUsername" required placeholder="Username" class="w-full border rounded p-2.5 text-base">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full border rounded p-2.5 text-base">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAuthModal()" class="px-4 py-2 text-base text-slate-600">Cancel</button>
          <button type="submit" class="px-5 py-2 text-base bg-indigo-600 text-white rounded font-semibold hover:bg-indigo-700 shadow">Log In</button>
        </div>
      </form>

      <form id="registerForm" onsubmit="performRegister(event)" class="hidden space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name</label>
          <input type="text" id="regFullName" required placeholder="e.g. Sarah Connor" class="w-full border rounded p-2.5 text-base">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="regUsername" required placeholder="e.g. s.connor" class="w-full border rounded p-2.5 text-base">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full border rounded p-2.5 text-base">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAuthModal()" class="px-4 py-2 text-base text-slate-600">Cancel</button>
          <button type="submit" class="px-5 py-2 text-base bg-green-600 text-white rounded font-semibold hover:bg-green-700 shadow">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Control Panel Modal -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-3xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-bold text-slate-900">⚙️ Admin Control Panel</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>

      <div class="space-y-6">
        <!-- Academic Year Setup -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">Academic Year Bounds</h4>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Term Start Date</label>
              <input type="date" id="adminTermStart" onchange="saveAdminSettings()" class="w-full border rounded p-2 text-sm bg-white">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Term End Date</label>
              <input type="date" id="adminTermEnd" onchange="saveAdminSettings()" class="w-full border rounded p-2 text-sm bg-white">
            </div>
          </div>
        </div>

        <!-- School Day Composition -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">The School Day (Periods & Times)</h4>
          <form onsubmit="addPeriod(event)" class="grid grid-cols-12 gap-2 mb-3">
            <input type="text" id="pName" placeholder="Name (e.g. Period 1)" required class="border rounded p-1.5 text-xs bg-white col-span-3">
            <input type="time" id="pStart" required class="border rounded p-1.5 text-xs bg-white col-span-2">
            <input type="time" id="pEnd" required class="border rounded p-1.5 text-xs bg-white col-span-2">
            <select id="pDay" class="border rounded p-1.5 text-xs bg-white col-span-3">
              <option value="All">All Days (Mon-Fri)</option>
              <option value="Monday">Monday Only</option>
              <option value="Tuesday">Tuesday Only</option>
              <option value="Wednesday">Wednesday Only</option>
              <option value="Thursday">Thursday Only</option>
              <option value="Friday">Friday Only</option>
            </select>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold p-1.5 col-span-2">+ Add</button>
          </form>
          <div id="periodList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto"></div>
        </div>

        <!-- School Holidays / Blackout Days -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">School Holidays & Blackout Days</h4>
          <form onsubmit="addHoliday(event)" class="grid grid-cols-3 gap-2 mb-3">
            <input type="text" id="holName" required placeholder="Blackout Name (e.g. INSET day 1)" class="border rounded p-2 text-xs bg-white col-span-3 sm:col-span-1">
            <input type="date" id="holStart" required class="border rounded p-2 text-xs bg-white">
            <input type="date" id="holEnd" required class="border rounded p-2 text-xs bg-white">
            <button type="submit" class="bg-indigo-600 text-white rounded text-xs font-semibold p-2 col-span-3 hover:bg-indigo-700">+ Add Blackout Day</button>
          </form>
          <div id="holidayList" class="space-y-1 text-xs max-h-32 overflow-y-auto"></div>
        </div>

        <!-- User Account Management -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">Teacher & Admin Account Management</h4>
          <form onsubmit="adminCreateUser(event)" class="bg-white p-3 rounded border mb-4 space-y-2">
            <div class="text-xs font-semibold text-slate-700">Create New Account</div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="adminNewName" placeholder="Full Name" required class="border rounded p-1.5 text-xs">
              <input type="text" id="adminNewUser" placeholder="Username" required class="border rounded p
