<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Exploratorium: Booking System CCB Primary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 font-sans">

  <!-- Header -->
  <header class="max-w-7xl mx-auto bg-indigo-900 text-white p-4 rounded-xl shadow-lg mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">The Exploratorium: Booking System CCB Primary</h1>
      <p class="text-xs text-indigo-200">Cloud Connected • Dynamic Timetable & Admin Controls</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="userInfo" class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-lg">Not logged in</span>
      <button id="adminPanelBtn" onclick="toggleAdminModal()" class="hidden bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-900 transition">⚙️ Admin Panel</button>
      <button id="loginBtn" onclick="handleAuthAction()" class="bg-indigo-500 hover:bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold transition">Login</button>
    </div>
  </header>

  <!-- Main Controls -->
  <main class="max-w-7xl mx-auto bg-white rounded-xl shadow p-6">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b">
      <div class="flex items-center gap-2">
        <button onclick="changeWeek(-1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-semibold text-slate-700">‹ Prev Week</button>
        <button onclick="resetWeek()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-sm font-semibold">Current Week</button>
        <button onclick="changeWeek(1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-semibold text-slate-700">Next Week ›</button>
        <span id="currentWeekLabel" class="ml-2 px-3 py-1.5 bg-slate-100 text-slate-800 rounded-lg text-sm font-bold border border-slate-200"></span>
      </div>
      <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition">🖨️ Door Display / Print</button>
    </div>

    <!-- Timetable Grid -->
    <div class="overflow-x-auto">
      <table class="w-full border-collapse text-center text-sm">
        <thead>
          <tr id="gridHeader" class="bg-slate-50 border-b"></tr>
        </thead>
        <tbody id="gridBody" class="divide-y divide-slate-200"></tbody>
      </table>
    </div>
  </main>

  <!-- Booking Modal -->
  <div id="bookingModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-6 max-w-md w-full shadow-2xl">
      <h3 id="modalTitle" class="text-lg font-bold mb-2">Book Slot</h3>
      <p id="modalSlotDetails" class="text-sm text-slate-500 mb-4"></p>
      
      <form id="bookingForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Teacher Name</label>
          <input type="text" id="userNameInput" required readonly class="w-full border bg-slate-50 rounded p-2 text-sm text-slate-600 outline-none">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Purpose / Class Details</label>
          <textarea id="userPurposeInput" placeholder="e.g. Year 10 Physics - Optics experiment with light kits" required rows="3" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        </div>

        <div id="adminRecurringOption" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-lg">
          <label class="flex items-center gap-2 cursor-pointer">
            <input type="checkbox" id="recurringCheckbox" class="rounded text-amber-600 focus:ring-amber-500">
            <span class="text-xs font-semibold text-amber-900">Repeat weekly for rest of school year</span>
          </label>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm font-semibold bg-indigo-600 text-white rounded hover:bg-indigo-700">Save Booking</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Login / Register Modal -->
  <div id="loginModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-40">
    <div class="bg-white rounded-xl p-6 max-w-sm w-full shadow-2xl">
      <div class="flex justify-between border-b pb-2 mb-4">
        <button id="tabLoginBtn" onclick="switchAuthTab('login')" class="font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1 text-sm">Login</button>
        <button id="tabRegisterBtn" onclick="switchAuthTab('register')" class="font-bold text-slate-400 hover:text-slate-600 pb-1 text-sm">Register (Teacher)</button>
      </div>

      <form id="loginForm" onsubmit="performLogin(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="loginUsername" required placeholder="admin or teacher" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="loginPassword" required class="w-full border rounded p-2 text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAuthModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded font-semibold hover:bg-indigo-700">Log In</button>
        </div>
      </form>

      <form id="registerForm" onsubmit="performRegister(event)" class="hidden space-y-3">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Full Name</label>
          <input type="text" id="regFullName" required placeholder="e.g. Sarah Connor" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Username</label>
          <input type="text" id="regUsername" required placeholder="e.g. s.connor" class="w-full border rounded p-2 text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Password</label>
          <input type="password" id="regPassword" required class="w-full border rounded p-2 text-sm">
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeAuthModal()" class="px-4 py-2 text-sm text-slate-600">Cancel</button>
          <button type="submit" class="px-4 py-2 text-sm bg-green-600 text-white rounded font-semibold hover:bg-green-700">Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Admin Control Panel Modal -->
  <div id="adminModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-6 max-w-3xl w-full shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-bold text-slate-900">⚙️ Admin Control Panel</h3>
        <button onclick="toggleAdminModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">✕</button>
      </div>

      <div class="space-y-6">
        <!-- Academic Year Setup -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">Academic Year Bounds</h4>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs text-slate-500 mb-1">Term Start Date</label>
              <input type="date" id="adminTermStart" onchange="saveAdminSettings()" class="w-full border rounded p-2 text-sm bg-white">
            </div>
            <div>
              <label class="block text-xs text-slate-500 mb-1">Term End Date</label>
              <input type="date" id="adminTermEnd" onchange="saveAdminSettings()" class="w-full border rounded p-2 text-sm bg-white">
            </div>
          </div>
        </div>

        <!-- School Day Composition (Periods Configuration) -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">The School Day (Periods & Times)</h4>
          <form onsubmit="addPeriod(event)" class="grid grid-cols-12 gap-2 mb-3">
            <input type="text" id="pName" placeholder="Name (e.g. Period 1)" required class="border rounded p-1.5 text-xs bg-white col-span-3">
            <input type="time" id="pStart" required class="border rounded p-1.5 text-xs bg-white col-span-2">
            <input type="time" id="pEnd" required class="border rounded p-1.5 text-xs bg-white col-span-2">
            <select id="pDay" class="border rounded p-1.5 text-xs bg-white col-span-3">
              <option value="All">All Days (Mon-Fri)</option>
              <option value="Monday">Monday Only</option>
              <option value="Tuesday">Tuesday Only</option>
              <option value="Wednesday">Wednesday Only</option>
              <option value="Thursday">Thursday Only</option>
              <option value="Friday">Friday Only</option>
            </select>
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded text-xs font-semibold p-1.5 col-span-2">+ Add</button>
          </form>
          <div id="periodsList" class="space-y-1.5 text-xs max-h-48 overflow-y-auto"></div>
        </div>

        <!-- School Holidays / Blackout Days -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">School Holidays & Blackout Days</h4>
          <form onsubmit="addHoliday(event)" class="grid grid-cols-3 gap-2 mb-3">
            <input type="text" id="holName" required placeholder="Blackout Name (e.g. INSET day 1)" class="border rounded p-2 text-xs bg-white col-span-3 sm:col-span-1">
            <input type="date" id="holStart" required class="border rounded p-2 text-xs bg-white">
            <input type="date" id="holEnd" required class="border rounded p-2 text-xs bg-white">
            <button type="submit" class="bg-indigo-600 text-white rounded text-xs font-semibold p-2 col-span-3 hover:bg-indigo-700">+ Add Blackout Day</button>
          </form>
          <div id="holidayList" class="space-y-1 text-xs max-h-32 overflow-y-auto"></div>
        </div>

        <!-- User Account Management & Creation -->
        <div class="bg-slate-50 p-4 rounded-lg border">
          <h4 class="font-bold text-sm text-slate-800 mb-2">Teacher & Admin Account Management</h4>
          <form onsubmit="adminCreateUser(event)" class="bg-white p-3 rounded border mb-4 space-y-2">
            <div class="text-xs font-semibold text-slate-700">Create New Account</div>
            <div class="grid grid-cols-2 gap-2">
              <input type="text" id="adminNewName" placeholder="Full Name" required class="border rounded p-1.5 text-xs">
              <input type="text" id="adminNewUser" placeholder="Username" required class="border rounded p-1.5 text-xs">
              <input type="password" id="adminNewPass" placeholder="Password" required class="border rounded p-1.5 text-xs">
              <select id="adminNewRole" class="border rounded p-1.5 text-xs bg-white font-medium">
                <option value="Teacher">Role: Teacher</option>
                <option value="Admin">Role: Administrator</option>
              </select>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white text-xs font-semibold p-1.5 rounded transition">+ Create User Account</button>
          </form>

          <div id="userList" class="space-y-2 text-xs max-h-40 overflow-y-auto"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
    
    let defaultPeriods = [
      { id: 'p1', name: 'Period 1', start: '08:15', end: '09:00', day: 'All' },
      { id: 'p2', name: 'Period 2', start: '09:00', end: '09:45', day: 'All' },
      { id: 'p3', name: 'Period 3', start: '10:05', end: '10:50', day: 'All' },
      { id: 'p4', name: 'Period 4', start: '10:50', end: '11:35', day: 'All' },
      { id: 'p5', name: 'Period 5', start: '12:30', end: '13:15', day: 'All' },
      { id: 'p6', name: 'Period 6', start: '13:15', end: '14:00', day: 'All' },
      { id: 'p7', name: 'Period 7', start: '14:20', end: '15:05', day: 'All' },
      { id: 'p8m', name: 'Period 8m', start: '15:05', end: '16:05', day: 'Monday' },
      { id: 'p8w', name: 'Period 8w', start: '15:05', end: '16:05', day: 'Wednesday' }
    ];

    let periods = JSON.parse(localStorage.getItem('room_periods') || JSON.stringify(defaultPeriods));
    let currentWeekOffset = 0;
    let currentUser = null;
    let selectedSlot = null;

    let bookings = JSON.parse(localStorage.getItem('room_bookings') || '{}');
    let holidays = JSON.parse(localStorage.getItem('room_holidays') || '[]');
    let adminSettings = JSON.parse(localStorage.getItem('room_admin_settings') || '{"termStart":"2026-08-15","termEnd":"2027-06-15"}');
    
    let users = JSON.parse(localStorage.getItem('room_users') || '[]');
    if (users.length === 0) {
      users = [
        { name: 'Admin User', username: 'admin', pass: 'admin123', role: 'Admin' },
        { name: 'Test Teacher', username: 'teacher', pass: 'teacher123', role: 'Teacher' }
      ];
      localStorage.setItem('room_users', JSON.stringify(users));
    }

    function getMondayOfWeek(offset) {
      const now = new Date();
      const currentDay = now.getDay();
      const distanceToMonday = (currentDay === 0 ? -6 : 1) - currentDay;
      const monday = new Date(now);
      monday.setDate(now.getDate() + distanceToMonday + (offset * 7));
      monday.setHours(0, 0, 0, 0);
      return monday;
    }

    function getWeekDateRange(offset) {
      const monday = getMondayOfWeek(offset);
      const friday = new Date(monday);
      friday.setDate(monday.getDate() + 4);
      const format = date => date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      return `Week: ${format(monday)} – ${format(friday)}`;
    }

    function getDateForDay(offset, dayIndex) {
      const monday = getMondayOfWeek(offset);
      const target = new Date(monday);
      target.setDate(monday.getDate() + dayIndex);
      return target;
    }

    function isHoliday(date) {
      const dateStr = date.toISOString().split('T')[0];
      return holidays.find(h => dateStr >= h.start && dateStr <= h.end);
    }

    function init() {
      renderHeader();
      renderGrid();
      document.getElementById('adminTermStart').value = adminSettings.termStart;
      document.getElementById('adminTermEnd').value = adminSettings.termEnd;
    }

    function renderHeader() {
      document.getElementById('currentWeekLabel').innerText = getWeekDateRange(currentWeekOffset);
      const userInfo = document.getElementById('userInfo');
      const loginBtn = document.getElementById('loginBtn');
      const adminBtn = document.getElementById('adminPanelBtn');

      if (currentUser) {
        userInfo.innerText = `${currentUser.name} (${currentUser.role})`;
        loginBtn.innerText = 'Logout';
        if (currentUser.role === 'Admin') {
          adminBtn.classList.remove('hidden');
        } else {
          adminBtn.classList.add('hidden');
        }
      } else {
        userInfo.innerText = 'Not logged in';
        loginBtn.innerText = 'Login';
        adminBtn.classList.add('hidden');
      }
    }

    function renderGrid() {
      const headerRow = document.getElementById('gridHeader');
      const body = document.getElementById('gridBody');

      headerRow.innerHTML = '<th class="p-3 border bg-slate-100 font-bold">Day</th>' + 
        periods.map(p => `<th class="p-2 border font-semibold"><div>${p.name}</div><div class="text-xs text-slate-400 font-normal">${p.start}-${p.end}</div></th>`).join('');

      body.innerHTML = DAYS.map((day, dayIndex) => {
        const slotDate = getDateForDay(currentWeekOffset, dayIndex);
        const holiday = isHoliday(slotDate);

        if (holiday) {
          return `
            <tr>
              <td class="p-3 border font-bold bg-amber-50 text-left">${day}</td>
              <td colspan="${periods.length}" class="p-3 border bg-amber-100/70 text-amber-900 font-bold text-center">
                ${holiday.name}
              </td>
            </tr>`;
        }

        const cells = periods.map(period => {
          if (period.day !== 'All' && period.day !== day) {
            return `<td class="p-2 border bg-slate-100 text-slate-300 text-xs">N/A</td>`;
          }
          const slotKey = `w${currentWeekOffset}_${day}_${period.id}`;
          const booking = bookings[slotKey];

          if (booking) {
            const canDelete = currentUser && (currentUser.role === 'Admin' || currentUser.username === booking.username);
            return `
              <td class="p-2 border bg-indigo-50 hover:bg-indigo-100 transition">
                <div class="font-bold text-indigo-900 text-xs">${booking.name}</div>
                <div class="text-xs text-indigo-700 truncate max-w-[120px]" title="${booking.purpose}">${booking.purpose}</div>
                ${canDelete ? `<button onclick="deleteBooking('${slotKey}')" class="text-xs text-red-500 hover:text-red-700 mt-1 block mx-auto font-semibold">✕ Delete</button>` : ''}
              </td>`;
          }

          return `
            <td class="p-2 border hover:bg-green-50 cursor-pointer transition" onclick="openBookingModal('${day}', '${period.id}')">
              <span class="text-xs text-green-600 font-semibold">+ Book</span>
            </td>`;
        }).join('');

        return `<tr><td class="p-3 border font-bold bg-slate-50 text-left">${day}</td>${cells}</tr>`;
      }).join('');
    }

    function openBookingModal(day, periodId) {
      if (!currentUser) {
        alert('Please log in first to make a booking.');
        switchAuthTab('login');
        document.getElementById('loginModal').classList.remove('hidden');
        return;
      }
      selectedSlot = { day, periodId };
      const period = periods.find(p => p.id === periodId);
      document.getElementById('modalSlotDetails').innerText = `${day} • ${period.name} (${period.start}-${period.end})`;
      document.getElementById('userNameInput').value = currentUser.name;
      
      const adminRec = document.getElementById('adminRecurringOption');
      if (currentUser.role === 'Admin') {
        adminRec.classList.remove('hidden');
      } else {
        adminRec.classList.add('hidden');
      }

      document.getElementById('bookingModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.add('hidden');
      document.getElementById('recurringCheckbox').checked = false;
      selectedSlot = null;
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      if (!selectedSlot) return;

      const purpose = document.getElementById('userPurposeInput').value.trim();
      const isRecurring = document.getElementById('recurringCheckbox').checked && currentUser.role === 'Admin';
      
      if (isRecurring) {
        for (let i = currentWeekOffset; i <= currentWeekOffset + 30; i++) {
          const key = `w${i}_${selectedSlot.day}_${selectedSlot.periodId}`;
          if (!bookings[key]) {
            bookings[key] = { name: currentUser.name, username: currentUser.username, purpose: purpose };
          }
        }
      } else {
        const slotKey = `w${currentWeekOffset}_${selectedSlot.day}_${selectedSlot.periodId}`;
        bookings[slotKey] = { name: currentUser.name, username: currentUser.username, purpose: purpose };
      }

      localStorage.setItem('room_bookings', JSON.stringify(bookings));
      closeModal();
      document.getElementById('userPurposeInput').value = '';
      renderGrid();
    }

    function deleteBooking(slotKey) {
      if (confirm('Are you sure you want to delete this booking?')) {
        delete bookings[slotKey];
        localStorage.setItem('room_bookings', JSON.stringify(bookings));
        renderGrid();
      }
    }

    function changeWeek(offset) {
      currentWeekOffset += offset;
      renderHeader();
      renderGrid();
    }

    function resetWeek() {
      currentWeekOffset = 0;
      renderHeader();
      renderGrid();
    }

    function handleAuthAction() {
      if (currentUser) {
        currentUser = null;
        renderHeader();
        renderGrid();
      } else {
        document.getElementById('loginModal').classList.remove('hidden');
      }
    }

    function closeAuthModal() {
      document.getElementById('loginModal').classList.add('hidden');
    }

    function switchAuthTab(tab) {
      if (tab === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('tabLoginBtn').className = 'font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1 text-sm';
        document.getElementById('tabRegisterBtn').className = 'font-bold text-slate-400 hover:text-slate-600 pb-1 text-sm';
      } else {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
        document.getElementById('tabRegisterBtn').className = 'font-bold text-indigo-600 border-b-2 border-indigo-600 pb-1 text-sm';
        document.getElementById('tabLoginBtn').className = 'font-bold text-slate-400 hover:text-slate-600 pb-1 text-sm';
      }
    }

    function performLogin(e) {
      e.preventDefault();
      const u = document.getElementById('loginUsername').value.trim();
      const p = document.getElementById('loginPassword').value.trim();

      const found = users.find(user => user.username.toLowerCase() === u.toLowerCase() && user.pass === p);
      if (!found) return alert('Invalid username or password!');

      currentUser = found;
      closeAuthModal();
      document.getElementById('loginPassword').value = '';
      renderHeader();
      renderGrid();
    }

    function performRegister(e) {
      e.preventDefault();
      const fullName = document.getElementById('regFullName').value.trim();
      const u = document.getElementById('regUsername').value.trim();
      const p = document.getElementById('regPassword').value.trim();

      if (users.find(user => user.username.toLowerCase() === u.toLowerCase())) {
        return alert('Username already exists. Please choose another.');
      }

      const newUser = { name: fullName, username: u, pass: p, role: 'Teacher' };
      users.push(newUser);
      localStorage.setItem('room_users', JSON.stringify(users));

      currentUser = newUser;
      closeAuthModal();
      alert(`Account created successfully! Welcome, ${fullName}.`);
      renderHeader();
      renderGrid();
    }

    function toggleAdminModal() {
      const modal = document.getElementById('adminModal');
      if (modal.classList.contains('hidden')) {
        renderAdminPanel();
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    function renderAdminPanel() {
      // Render Periods
      const pList = document.getElementById('periodsList');
      pList.innerHTML = periods.map((p, index) => `
        <div class="flex justify-between items-center bg-white p-2 rounded border">
          <div>
            <strong>${p.name}</strong> <span class="text-slate-500">(${p.start} - ${p.end})</span>
            <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] bg-indigo-50 text-indigo-700">${p.day}</span>
          </div>
          <button onclick="deletePeriod(${index})" class="text-red-500 font-semibold hover:underline">Remove</button>
        </div>
      `).join('');

      // Render Holidays
      const holList = document.getElementById('holidayList');
      holList.innerHTML = holidays.length === 0 ? '<p class="text-slate-400 italic">No blackout days configured.</p>' :
        holidays.map((h, index) => `
          <div class="flex justify-between items-center bg-white p-2 rounded border">
            <div><strong>${h.name}</strong> (${h.start} to ${h.end})</div>
            <button onclick="deleteHoliday(${index})" class="text-red-500 font-bold hover:underline">Remove</button>
          </div>
        `).join('');

      // Render Users
      const uList = document.getElementById('userList');
      uList.innerHTML = users.map((u, index) => `
        <div class="flex justify-between items-center bg-white p-2 rounded border">
          <div>
            <strong>${u.name}</strong> <span class="text-slate-400">(@${u.username})</span>
            <span class="ml-2 px-1.5 py-0.5 rounded text-[10px] ${u.role === 'Admin' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600'}">${u.role}</span>
          </div>
          <div class="flex gap-2">
            <button onclick="resetPassword(${index})" class="text-indigo-600 font-semibold hover:underline">Reset Password</button>
            ${u.role !== 'Admin' ? `<button onclick="deleteUserAccount(${index})" class="text-red-500 font-semibold hover:underline">Delete Account</button>` : ''}
          </div>
        </div>
      `).join('');
    }

    function addPeriod(e) {
      e.preventDefault();
      const name = document.getElementById('pName').value.trim();
      const start = document.getElementById('pStart').value;
      const end = document.getElementById('pEnd').value;
      const day = document.getElementById('pDay').value;
      const id = 'p_' + Date.now();

      periods.push({ id, name, start, end, day });
      localStorage.setItem('room_periods', JSON.stringify(periods));

      document.getElementById('pName').value = '';
      document.getElementById('pStart').value = '';
      document.getElementById('pEnd').value = '';

      renderAdminPanel();
      renderGrid();
    }

    function deletePeriod(index) {
      if (confirm('Are you sure you want to delete this period?')) {
        periods.splice(index, 1);
        localStorage.setItem('room_periods', JSON.stringify(periods));
        renderAdminPanel();
        renderGrid();
      }
    }

    function adminCreateUser(e) {
      e.preventDefault();
      const fullName = document.getElementById('adminNewName').value.trim();
      const u = document.getElementById('adminNewUser').value.trim();
      const p = document.getElementById('adminNewPass').value.trim();
      const role = document.getElementById('adminNewRole').value;

      if (users.find(user => user.username.toLowerCase() === u.toLowerCase())) {
        return alert('Username already exists. Please choose another.');
      }

      users.push({ name: fullName, username: u, pass: p, role: role });
      localStorage.setItem('room_users', JSON.stringify(users));

      document.getElementById('adminNewName').value = '';
      document.getElementById('adminNewUser').value = '';
      document.getElementById('adminNewPass').value = '';

      alert(`Account for "${fullName}" created successfully as ${role}!`);
      renderAdminPanel();
    }

    function deleteUserAccount(index) {
      const targetUser = users[index];
      if (confirm(`Are you sure you want to delete the account for "${targetUser.name}"? This will also remove their active bookings.`)) {
        Object.keys(bookings).forEach(key => {
          if (bookings[key].username === targetUser.username) {
            delete bookings[key];
          }
        });
        localStorage.setItem('room_bookings', JSON.stringify(bookings));

        users.splice(index, 1);
        localStorage.setItem('room_users', JSON.stringify(users));

        renderAdminPanel();
        renderGrid();
      }
    }

    function addHoliday(e) {
      e.preventDefault();
      const name = document.getElementById('holName').value.trim();
      const start = document.getElementById('holStart').value;
      const end = document.getElementById('holEnd').value;

      holidays.push({ name, start, end });
      localStorage.setItem('room_holidays', JSON.stringify(holidays));
      
      document.getElementById('holName').value = '';
      document.getElementById('holStart').value = '';
      document.getElementById('holEnd').value = '';
      
      renderAdminPanel();
      renderGrid();
    }

    function deleteHoliday(index) {
      holidays.splice(index, 1);
      localStorage.setItem('room_holidays', JSON.stringify(holidays));
      renderAdminPanel();
      renderGrid();
    }

    function resetPassword(index) {
      const newPass = prompt(`Enter new password for ${users[index].name}:`);
      if (newPass) {
        users[index].pass = newPass;
        localStorage.setItem('room_users', JSON.stringify(users));
        alert('Password updated successfully!');
      }
    }

    function saveAdminSettings() {
      adminSettings.termStart = document.getElementById('adminTermStart').value;
      adminSettings.termEnd = document.getElementById('adminTermEnd').value;
      localStorage.setItem('room_admin_settings', JSON.stringify(adminSettings));
    }

    init();
  </script>
</body>
</html>
