<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Exploratorium: Booking System CCB Primary</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAQstCkN_l8reJTQevt_-rVcbqoGDKjydo",
      authDomain: "exploratorium---booking.firebaseapp.com",
      databaseURL: "https://exploratorium---booking-default-rtdb.firebaseio.com",
      projectId: "exploratorium---booking",
      storageBucket: "exploratorium---booking.firebasestorage.app",
      messagingSenderId: "1027467157404",
      appId: "1:1027467157404:web:d4809afdcece911252f259"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
  </script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen p-4 font-sans">

  <!-- Header -->
  <header class="max-w-7xl mx-auto bg-indigo-900 text-white p-4 rounded-xl shadow-lg mb-6 flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold">The Exploratorium: Booking System CCB Primary</h1>
      <p class="text-xs text-indigo-200">Cloud Connected • Dynamic Timetable & Admin Controls</p>
    </div>
    <div class="flex items-center gap-3">
      <span id="userInfo" class="text-xs font-medium bg-indigo-800 px-3 py-1 rounded-lg">Not logged in</span>
      <button id="adminPanelBtn" onclick="toggleAdminModal()" class="hidden bg-amber-500 hover:bg-amber-600 px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-900 transition">⚙️ Admin Panel</button>
      <button id="loginBtn" onclick="handleAuthAction()" class="bg-indigo-500 hover:bg-indigo-600 px-4 py-2 rounded-lg text-sm font-semibold transition">Login</button>
    </div>
  </header>

  <!-- Main Controls -->
  <main class="max-w-7xl mx-auto bg-white rounded-xl shadow p-6">
    <div class="flex flex-wrap justify-between items-center gap-4 mb-6 pb-4 border-b">
      <div class="flex items-center gap-2">
        <button onclick="changeWeek(-1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-semibold text-slate-700">‹ Prev Week</button>
        <button onclick="resetWeek()" class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 rounded-lg text-sm font-semibold">Current Week</button>
        <button onclick="changeWeek(1)" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 rounded-lg text-sm font-semibold text-slate-700">Next Week ›</button>
        <span id="currentWeekLabel" class="ml-2 px-3 py-1.5 bg-slate-100 text-slate-800 rounded-lg text-sm font-bold border border-slate-200"></span>
      </div>
      <button onclick="window.print()" class="bg-slate-800 text-white px-4 py-2 rounded-lg text-sm font-semibold hover:bg-slate-900 transition">🖨️ Door Display / Print</button>
    </div>

    <!-- Timetable Grid Container -->
    <div id="gridContainer"></div>
  </main>

  <script>
    // Global State Variables
    let currentUser = null;
    let users = [];
    let holidays = [];
    let currentWeekOffset = 0;

    // Real-time Firebase Users Sync across all devices
    db.ref('users').on('value', (snapshot) => {
      const data = snapshot.val();
      users = [];
      if (data) {
        Object.keys(data).forEach((key) => {
          const userObj = data[key];
          if (userObj && typeof userObj === 'object') {
            users.push({
              username: userObj.username || key,
              name: userObj.name || userObj.fullName || key,
              pass: userObj.pass || '',
              role: userObj.role || 'Teacher'
            });
          }
        });
      }

      if (currentUser) {
        const updatedUser = users.find((u) => u.username === currentUser.username);
        if (updatedUser) currentUser = updatedUser;
      }

      if (typeof renderHeader === 'function') renderHeader();
      if (typeof renderAdminPanel === 'function') renderAdminPanel();
      if (typeof renderGrid === 'function') renderGrid();
    });

    // Real-time Firebase Holidays Sync across all devices
    db.ref('holidays').on('value', (snapshot) => {
      const data = snapshot.val();
      holidays = data ? (Array.isArray(data) ? data.filter(Boolean) : Object.values(data)) : [];
      if (typeof renderAdminPanel === 'function') renderAdminPanel();
      if (typeof renderGrid === 'function') renderGrid();
    });

    // Helper & Grid Logic
    function getStartOfWeek(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function formatDate(date) {
      return date.toISOString().split('T')[0];
    }

    function changeWeek(offset) {
      currentWeekOffset += offset;
      renderGrid();
    }

    function resetWeek() {
      currentWeekOffset = 0;
      renderGrid();
    }

    function renderHeader() {
      const userInfo = document.getElementById('userInfo');
      const loginBtn = document.getElementById('loginBtn');
      const adminPanelBtn = document.getElementById('adminPanelBtn');

      if (currentUser) {
        if (userInfo) userInfo.textContent = `${currentUser.name} (${currentUser.role})`;
        if (loginBtn) loginBtn.textContent = 'Logout';
        if (adminPanelBtn) {
          if (currentUser.role === 'Admin') {
            adminPanelBtn.classList.remove('hidden');
          } else {
            adminPanelBtn.classList.add('hidden');
          }
        }
      } else {
        if (userInfo) userInfo.textContent = 'Not logged in';
        if (loginBtn) loginBtn.textContent = 'Login';
        if (adminPanelBtn) adminPanelBtn.classList.add('hidden');
      }
    }

    function renderGrid() {
      const gridContainer = document.getElementById('gridContainer');
      const currentWeekLabel = document.getElementById('currentWeekLabel');
      if (!gridContainer) return;

      const today = new Date();
      today.setDate(today.getDate() + (currentWeekOffset * 7));
      const monday = getStartOfWeek(today);

      const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
      const periods = ['Period 1', 'Period 2', 'Period 3', 'Period 4', 'Period 5', 'Period 6'];

      if (currentWeekLabel) {
        const sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 4);
        currentWeekLabel.textContent = `${monday.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${sunday.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
      }

      let tableHTML = `
        <div class="overflow-x-auto">
          <table class="w-full border-collapse border border-slate-200">
            <thead>
              <tr class="bg-slate-100 border-b border-slate-200 text-slate-700">
                <th class="p-3 border-r border-slate-200 text-left w-28">Period</th>
      `;

      days.forEach((day, index) => {
        const dateObj = new Date(monday);
        dateObj.setDate(monday.getDate() + index);
        const dateStr = formatDate(dateObj);
        const isHoliday = holidays.includes(dateStr);

        tableHTML += `
          <th class="p-3 border-r border-slate-200 text-center ${isHoliday ? 'bg-amber-100 text-amber-900' : ''}">
            <div class="font-bold">${day}</div>
            <div class="text-xs font-normal text-slate-500">${dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}</div>
            ${isHoliday ? '<span class="text-[10px] font-bold uppercase text-amber-700 bg-amber-200 px-1.5 py-0.5 rounded mt-1 inline-block">Holiday</span>' : ''}
          </th>
        `;
      });

      tableHTML += `</tr></thead><tbody>`;

      periods.forEach((period) => {
      tableHTML += `<tr class="border-b border-slate-200 hover:bg-slate-50/50">`;
      tableHTML += `<td class="p-3 font-semibold text-xs border-r border-slate-200 bg-slate-50 text-slate-600">${period}</td>`;

      days.forEach((day, index) => {
        const dateObj = new Date(monday);
        dateObj.setDate(monday.getDate() + index);
        const dateStr = formatDate(dateObj);
        const isHoliday = holidays.includes(dateStr);

        tableHTML += `
          <td class="p-2 border-r border-slate-200 align-top min-h-[80px] h-20 ${isHoliday ? 'bg-amber-50/50' : ''}">
            <div class="h-full flex flex-col justify-between p-1 rounded border border-dashed border-slate-200 hover:border-indigo-300 transition cursor-pointer">
              <span class="text-[11px] text-slate-400 font-medium">+ Book</span>
            </div>
          </td>
        `;
      });

      tableHTML += `</tr>`;
    });

    tableHTML += `</tbody></table></div>`;
    gridContainer.innerHTML = tableHTML;
      
    function init() {
      renderHeader();
      renderGrid();
    }

    // Direct initialization call
    init();
  </script>
</body>
</html>
